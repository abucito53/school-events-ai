services:
  ollama:
    image: ollama/ollama:latest
    container_name: school-events-ollama
    restart: unless-stopped
    volumes:
      # Model weights (several GB) live in a named Docker volume, so they
      # survive container restarts/rebuilds.
      - ollama_data:/root/.ollama
    ports:
      # Exposed to the host so you can reach the model without docker exec
      # (e.g. for manual testing, or if you ever run the scheduler natively
      # instead of in Docker).
      - "11434:11434"

  school-events:
    build: .
    container_name: school-events-ai
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - TZ=Europe/Zurich
    volumes:
      # All generated data (PDFs, emails, events.json, local .ics copy) -
      # stays on the host, independent of the container's lifecycle.
      - ${HOME}/SchulTermine:/data/SchulTermine
      # Config + OAuth2 files are mounted in from outside, never baked
      # into the image (see .dockerignore).
      - ./config.yaml:/app/config.yaml:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json

volumes:
  ollama_data:
